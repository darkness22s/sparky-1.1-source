name: Build All Platforms

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.1.10)"
        required: false
        type: string
      platform:
        description: "Platform to build for a manual artifact-only run"
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: write

defaults:
  run:
    working-directory: sparky-desktop/source

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release_name: ${{ steps.resolve.outputs.name }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@9

      - id: resolve
        name: Resolve release version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
            if [[ -z "$raw" ]]; then
              echo "workflow_dispatch requires the version input." >&2
              exit 1
            fi
          else
            raw="$GITHUB_REF_NAME"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "name=Sparky v$version" >> "$GITHUB_OUTPUT"

          selection="${{ inputs.platform || 'all' }}"
          case "$selection" in
            windows)
              matrix='{"include":[{"label":"Windows x64","runner":"windows-latest","platform":"win","target":"nsis","arch":"x64"}]}'
              ;;
            macos)
              matrix='{"include":[{"label":"macOS (arm64)","runner":"macos-latest","platform":"mac","target":"dmg","arch":"arm64"}]}'
              ;;
            linux)
              matrix='{"include":[{"label":"Linux x64","runner":"ubuntu-latest","platform":"linux","target":"AppImage","arch":"x64"}]}'
              ;;
            all)
              matrix='{"include":[{"label":"macOS (arm64)","runner":"macos-latest","platform":"mac","target":"dmg","arch":"arm64"},{"label":"Linux x64","runner":"ubuntu-latest","platform":"linux","target":"AppImage","arch":"x64"},{"label":"Windows x64","runner":"windows-latest","platform":"win","target":"nsis","arch":"x64"}]}'
              ;;
            *)
              echo "Invalid platform selection: $selection" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        shell: bash
        run: |
          # Exclude infra/* (relay) from workspace — it needs private registry
          # auth not available in CI. Desktop packages don't depend on it.
          grep -v 'infra/\*' pnpm-workspace.yaml > pnpm-workspace.yaml.tmp
          mv pnpm-workspace.yaml.tmp pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Install ImageMagick (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build desktop artifact
        shell: bash
        env:
          SPARKY_UPDATE_URL: ${{ vars.SPARKY_UPDATE_SITE_URL }}${{ matrix.update_path }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          pnpm run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: sparky-desktop/source/release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    if: github.event_name != 'workflow_dispatch' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: false
