name: Build Sparky Linux Installer

on:
  push:
    branches:
      - codex/linux-deb-installer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sparky-desktop/source

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install Linux packaging and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot imagemagick libarchive-tools xvfb

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Verify release version parity
        shell: pwsh
        working-directory: .
        run: ./scripts/assert-release-parity.ps1 -ExpectedVersion 1.1.2 -RepoRoot $PWD

      - name: Test the Linux packaging configuration
        run: pnpm vp test run scripts/build-desktop-artifact.test.ts

      - name: Build the Rust agent
        run: cargo build --release -p sparky_cli
        working-directory: .

      - name: Build the desktop workspace
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Package the portable AppImage
        run: pnpm dist:desktop:linux --skip-build
        env:
          NODE_ENV: production

      - name: Package the native Debian installer
        run: pnpm dist:desktop:linux:deb --skip-build
        env:
          NODE_ENV: production

      - name: Inspect and install the Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find release -maxdepth 1 -type f -name 'Sparky-*.AppImage' -print -quit)"
          deb="$(find release -maxdepth 1 -type f -name 'Sparky-*.deb' -print -quit)"
          test -n "$appimage" && test -s "$appimage"
          test -n "$deb" && test -s "$deb"

          chmod +x "$appimage"
          file "$appimage" | tee release/appimage-file.txt
          file "$deb" | tee release/deb-file.txt
          dpkg-deb --info "$deb" | tee release/deb-control.txt
          dpkg-deb --contents "$deb" | tee release/deb-contents.txt

          rm -rf "$RUNNER_TEMP/sparky-appimage" "$RUNNER_TEMP/sparky-deb"
          mkdir -p "$RUNNER_TEMP/sparky-appimage" "$RUNNER_TEMP/sparky-deb"
          (
            cd "$RUNNER_TEMP/sparky-appimage"
            "$GITHUB_WORKSPACE/sparky-desktop/source/$appimage" --appimage-extract >/dev/null
          )
          dpkg-deb --extract "$deb" "$RUNNER_TEMP/sparky-deb"

          appimage_agent="$(find "$RUNNER_TEMP/sparky-appimage" -type f -path '*/resources/sparky/sparky' -print -quit)"
          deb_agent="$(find "$RUNNER_TEMP/sparky-deb" -type f -path '*/resources/sparky/sparky' -print -quit)"
          test -x "$appimage_agent"
          test -x "$deb_agent"
          file "$appimage_agent" | tee release/appimage-agent-file.txt
          file "$deb_agent" | tee release/deb-agent-file.txt
          "$appimage_agent" --version | tee release/appimage-agent-version.txt
          "$deb_agent" --version | tee release/deb-agent-version.txt

          sudo dpkg --install "$deb" || sudo apt-get install -f -y
          package_name="$(dpkg-deb --field "$deb" Package)"
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture} ${Status}\n' "$package_name" | tee release/deb-installed.txt

          installed_app="$(find /opt /usr/lib -maxdepth 4 -type f -name t3code -print -quit 2>/dev/null)"
          test -n "$installed_app" && test -x "$installed_app"
          set +e
          timeout 20s xvfb-run -a "$installed_app" --no-sandbox --disable-gpu --user-data-dir="$RUNNER_TEMP/sparky-user" >release/desktop-launch.log 2>&1
          launch_status=$?
          set -e
          if [[ "$launch_status" -ne 0 && "$launch_status" -ne 124 ]]; then
            cat release/desktop-launch.log
            exit "$launch_status"
          fi
          test "$launch_status" -eq 124

          sha256sum "$appimage" "$deb" | tee release/linux-sha256.txt
          stat --printf='%n %s bytes\n' "$appimage" "$deb" | tee release/linux-sizes.txt

      - name: Upload verified Linux packages and evidence
        uses: actions/upload-artifact@v4
        with:
          name: sparky-1.1.2-linux-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            sparky-desktop/source/release/*.AppImage
            sparky-desktop/source/release/*.AppImage.zsync
            sparky-desktop/source/release/*.deb
            sparky-desktop/source/release/latest-linux.yml
            sparky-desktop/source/release/linux-sha256.txt
            sparky-desktop/source/release/linux-sizes.txt
            sparky-desktop/source/release/*-file.txt
            sparky-desktop/source/release/*-version.txt
            sparky-desktop/source/release/deb-control.txt
            sparky-desktop/source/release/deb-contents.txt
            sparky-desktop/source/release/deb-installed.txt
            sparky-desktop/source/release/desktop-launch.log
